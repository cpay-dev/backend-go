openapi: 3.1.0
info:
  title: CPay API
  version: v1
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      summary: Login and get JWT pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Success
  /v1/merchant/settings:
    get:
      summary: Get merchant payout settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant_id: { type: string }
                  settlement_address:
                    type: string
                    nullable: true
    patch:
      summary: Update merchant payout settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_address]
              properties:
                settlement_address:
                  type: string
                  description: EVM wallet address that receives automatic payouts.
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid settlement address
        '403':
          description: User token required
  /v1/products:
    post:
      summary: Create product
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
    get:
      summary: List products
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
  /v1/products/{id}:
    get:
      summary: Get public product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
    post:
      summary: Update product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
    delete:
      summary: Delete product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Deleted
  /v1/public/products/{id}:
    get:
      summary: Get public product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
        '404':
          description: Product not found
  /v1/products/{id}/image:
    post:
      summary: Upload product image
      description: Uploads a product image, stores it in media storage, and updates the product image_url.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or GIF image up to 5MB.
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_url: { type: string }
                  product: { type: object }
        '400':
          description: Invalid upload
        '404':
          description: Product not found
        '413':
          description: Image too large
        '503':
          description: Media storage unavailable
  /v1/public/product_images/{merchant_id}/{product_id}/{image_id}:
    get:
      summary: Fetch uploaded product image
      parameters:
        - in: path
          name: merchant_id
          required: true
          schema: { type: string }
        - in: path
          name: product_id
          required: true
          schema: { type: string }
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        '404':
          description: Not found
  /v1/payment_links:
    post:
      summary: Create payment link
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
    get:
      summary: List payment links
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
  /v1/payment_links/{id}:
    get:
      summary: Get payment link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
        '404':
          description: Not found
    patch:
      summary: Update payment link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                pricing_mode:
                  type: string
                  enum: [fixed, open]
                amount:
                  type: number
                  nullable: true
                currency:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
  /v1/payment_links/{id}/archive:
    post:
      summary: Archive payment link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Archived
        '404':
          description: Not found
  /v1/payment_links/{id}/sessions:
    post:
      summary: Create checkout session from payment link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
  /v1/public/payment_links/{code}:
    get:
      summary: Get public payment link
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  code: { type: string }
                  title: { type: string }
                  description: { type: string, nullable: true }
                  image_url: { type: string, nullable: true }
                  pricing_mode: { type: string, enum: [fixed, open] }
                  amount: { type: number, nullable: true }
                  currency: { type: string }
                  cta_text: { type: string }
                  allowed_tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        chain: { type: string }
                        symbol: { type: string }
                        address: { type: string }
                        decimals: { type: integer }
                  customer_fields:
                    type: array
                    items: { type: string }
                  custom_fields:
                    type: array
                    items: { type: object }
                  after_payment:
                    type: object
                    properties:
                      type: { type: string }
                      success_message: { type: string, nullable: true }
                      redirect_url: { type: string, nullable: true }
                  options:
                    type: object
                  product:
                    type: object
                    nullable: true
        '404':
          description: Not found
  /v1/public/payment_links/{id}/sessions:
    post:
      summary: Create public checkout session from payment link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /v1/public/checkout/{session_id}:
    get:
      summary: Fetch hosted checkout session data by client secret
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  chain: { type: string }
                  token_symbol: { type: string }
                  expires_at: { type: string, format: date-time }
                  payment_intent_id: { type: string }
                  payment_intent_status: { type: string }
                  received_amount: { type: number }
                  confirmations: { type: integer }
                  required_confirmations: { type: integer }
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        tx_hash: { type: string }
                        amount: { type: number }
                        chain: { type: string }
                        token_symbol: { type: string }
                        confirmations: { type: integer }
                        status: { type: string }
                        block_number: { type: integer }
                  deposit_address: { type: string }
                  link:
                    type: object
                    properties:
                      title: { type: string }
                      description: { type: string, nullable: true }
                      image_url: { type: string, nullable: true }
                      cta_text: { type: string }
                      after_payment:
                        type: object
                        properties:
                          type: { type: string }
                          redirect_url: { type: string, nullable: true }
                          success_message: { type: string, nullable: true }
  /v1/checkout/{session_id}/confirm:
    post:
      summary: Confirm observed chain transaction for checkout
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Updated
  /v1/mock_transfers:
    post:
      summary: Queue mock stablecoin transfer for a checkout session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
                received_amount: { type: number }
                confirmations: { type: integer }
                tx_hash: { type: string }
                block_number: { type: integer }
                from_address: { type: string }
                to_address: { type: string }
                raw_payload: { type: object }
      responses:
        '202':
          description: Queued
  /v1/webhook_endpoints:
    post:
      summary: Register merchant webhook endpoint
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
  /v1/subscriptions:
    post:
      summary: Create prepaid-vault subscription
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
