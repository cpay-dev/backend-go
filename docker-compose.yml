services:
  postgres:
    image: postgres:18
    container_name: cpay-postgres
    environment:
      POSTGRES_DB: cpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpay"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: cpay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cpay-admin
      MINIO_ROOT_PASSWORD: cpay-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data

  nats:
    image: nats:2.11-alpine
    container_name: cpay-nats
    ports:
      - "4222:4222"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cpay?sslmode=disable
      MIGRATIONS_PATH: /migrations
      JWT_SECRET: cpay-dev-jwt-secret
      KEY_ENCRYPTION_KEY: cpay-dev-master-key-change-me
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment: &service_env
      APP_ENV: development
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cpay?sslmode=disable
      MIGRATIONS_PATH: /migrations
      JWT_SECRET: cpay-dev-jwt-secret
      KEY_ENCRYPTION_KEY: cpay-dev-master-key-change-me
      NATS_URL: nats://nats:4222
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      AUTH_GRPC_ADDR: auth-service:9091
      PAYMENT_LINK_GRPC_ADDR: payment-link-service:9092
      CHECKOUT_GRPC_ADDR: checkout-service:9093
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: cpay-admin
      MINIO_ROOT_PASSWORD: cpay-secret-key
      MINIO_BUCKET: cpay-invoices
      MINIO_USE_SSL: "false"
      CHAIN_CONFIRMATIONS: ethereum:12,polygon:12,arbitrum:20,base:12
      DEFAULT_TOLERANCE_PERCENT: "0.25"
      BOOTSTRAP_MERCHANT_NAME: Demo Merchant
      BOOTSTRAP_ADMIN_EMAIL: admin@cpay.dev
      BOOTSTRAP_ADMIN_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      payment-link-service:
        condition: service_started
      checkout-service:
        condition: service_started
    ports:
      - "8080:8080"

  outbox-relay-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: outbox-relay-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8081
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8081:8081"

  webhook-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: webhook-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8082
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8082:8082"

  email-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: email-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8090
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8090:8090"

  chain-observer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: chain-observer-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8083
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      checkout-service:
        condition: service_started
    ports:
      - "8083:8083"

  payout-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payout-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8084
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: subscription-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8085
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8086
      GRPC_ADDR: :9091
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8086:8086"
      - "9091:9091"

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8087
    ports:
      - "8087:8087"

  payment-link-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-link-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8088
      GRPC_ADDR: :9092
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
      - "9092:9092"

  checkout-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: checkout-service
    environment:
      <<: *service_env
      HTTP_ADDR: :8089
      GRPC_ADDR: :9093
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8089:8089"
      - "9093:9093"
