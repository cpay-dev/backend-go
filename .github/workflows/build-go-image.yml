name: Build Go Docker image

on:
  workflow_dispatch:
    inputs:
      package:
        description: Path to Go package (used for --build-arg PACKAGE)
        required: true
      service:
        description: Image name without tag
        required: true
      tag:
        description: Image tag
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Tailscale
        uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          use-cache: 'true'
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-github
          version: 1.86.2

      - name: Log in to registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ secrets.DEV_DOCKER_REGISTRY_HOST }}
          username: 'github'
          password: ${{ secrets.DEV_DOCKER_REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          install: true

      - name: Build and optionally push per-arch image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: '.'
          file: './Dockerfile'
          build-args: |
            PACKAGE=${{ inputs.package }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DEV_DOCKER_REGISTRY_HOST }}/${{ inputs.service }}:${{ inputs.tag }}
          push: true
