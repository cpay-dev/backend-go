name: Build Docker image

on:
  # push:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - package: cmd/api/authn
            service_tag: authn

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_CPAY_DEV_GIT }}

      - name: Derive image name
        id: names
        run: |
          PACKAGE="${{ matrix.package }}"
          # Strip leading 'cmd/' from the package path
          SERVICE_PATH="$(echo "$PACKAGE" | sed 's#^cmd/##')"
          # Replace remaining '/' with '-' to form the image suffix
          SERVICE_NAME="$(echo "$SERVICE_PATH" | sed 's#/#-#g')"
          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: '.'
          file: './Dockerfile'
          build-args: |
            PACKAGE=${{ matrix.package }}
          tags: ghcr.io/cpay-dev/backend-go-${{ steps.names.outputs.service_name }}:${{ matrix.service_tag }}
          push: true
