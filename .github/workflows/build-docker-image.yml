name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      package:
        description: Path to Go package (used for --build-arg PACKAGE)
        required: true
      service:
        description: Image name without tag
        required: true
      tag:
        description: Image tag
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install CA
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /usr/local/share/ca-certificates
          echo "${{ secrets.DEV_DOCKER_REGISTRY_CA_B64 }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/registry-ca.crt >/dev/null
          sudo update-ca-certificates

          sudo mkdir -p "/etc/docker/certs.d/${{ secrets.DEV_DOCKER_REGISTRY_HOST }}:10003"
          echo "${{ secrets.DEV_DOCKER_REGISTRY_CA_B64 }}" | base64 -d | sudo tee "/etc/docker/certs.d/${{ secrets.DEV_DOCKER_REGISTRY_HOST }}:10003/ca.crt" >/dev/null
          sudo systemctl restart docker

      - name: Setup Tailscale
        uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          use-cache: 'true'
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-github
          version: 1.86.2

      - name: Point Docker to Tailscale DNS
        run: |
          set -euo pipefail
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"dns":["100.100.100.100"]}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json >/dev/null
          else
            echo '{ "dns": ["100.100.100.100"] }' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          sudo systemctl restart docker

      - name: Verify Docker can resolve registry via Tailscale DNS
        run: |
          docker run --rm busybox nslookup "${{ secrets.DEV_DOCKER_REGISTRY_HOST }}"

      - name: Smoke check registry API
        run: curl -s -o /dev/null -I https://${{ secrets.DEV_DOCKER_REGISTRY_HOST }}:10003/v2/

      - name: Log in to registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: "${{ secrets.DEV_DOCKER_REGISTRY_HOST }}:10003"
          username: 'github'
          password: ${{ secrets.DEV_DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: '.'
          file: './Dockerfile'
          build-args: |
            PACKAGE=${{ inputs.package }}
          tags: "${{ secrets.DEV_DOCKER_REGISTRY_HOST }}:10003/${{ inputs.service }}:${{ inputs.tag }}"
          push: true
